name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default; only the publish job is given more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Ecommerce_Backend.slnx

      - name: Build (Release)
        run: dotnet build Ecommerce_Backend.slnx --configuration Release --no-restore

      # The integration tests talk to a real Service Bus emulator. Starting it from the repo's own
      # compose file reuses the committed queue definitions (Config.json), which a plain GitHub
      # service container cannot mount. Only the emulator and its store are started.
      - name: Generate a throwaway .env
        run: ./scripts/make-ci-env.sh

      - name: Start the Service Bus emulator
        run: |
          docker compose up -d servicebus-emulator
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 5 http://localhost:5300/health > /dev/null; then
              echo "Emulator is ready."
              exit 0
            fi
            sleep 3
          done
          echo "Emulator did not become ready in time."
          docker compose logs servicebus-emulator
          exit 1

      - name: Test (unit and integration)
        run: >
          dotnet test Ecommerce_Backend.slnx
          --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Stop the emulator
        if: always()
        run: docker compose down -v

  migration-check:
    name: Migration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore Ecommerce_Backend/Ecommerce_Backend.csproj

      # Fails the build if the EF Core model changed without a matching migration.
      - name: Check for pending model changes
        run: dotnet ef migrations has-pending-model-changes --project Ecommerce_Backend/Ecommerce_Backend.csproj

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # Builds are not pushed here, so a broken Dockerfile is caught before merge.
      - name: Build the api and consumer image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: false
          build-args: COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build the migrator image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          target: migrator
          push: false
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,scope=migrator,mode=max

  smoke-test:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate a throwaway .env
        run: ./scripts/make-ci-env.sh

      - name: Run the smoke test against the compose stack
        shell: pwsh
        run: ./scripts/smoke-test.ps1
        env:
          COMMIT_SHA: ${{ github.sha }}

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear the stack down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish images
    needs: [build-and-test, migration-check, docker-build, smoke-test]
    # Only after a merge to main or a version tag, never for pull requests.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the short commit SHA always, plus the version (1.2.0) when a v1.2.0 tag is pushed.
      # There is deliberately no "latest" tag.
      - name: Image tags for the app
        id: app-meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
          flavor: latest=false

      - name: Push the app image (used by the api and the consumer)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          build-args: COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=app

      - name: Image tags for the migrator
        id: migrator-meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-migrator
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
          flavor: latest=false

      - name: Push the migrator image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.migrator-meta.outputs.tags }}
          labels: ${{ steps.migrator-meta.outputs.labels }}
          cache-from: type=gha,scope=migrator
