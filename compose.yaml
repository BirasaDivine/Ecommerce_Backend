# Local stack: API + consumer + one-off migrator + SQL Server + Azure Service Bus emulator
# (and the emulator's sql-edge store).
# Copy .env.example to .env and fill in the values, then: docker compose up --build

name: ecommerce-backend

# The api and the consumer are the same image started in different roles.
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    # Reported by /version; CI passes the commit SHA, local builds report "unknown".
    COMMIT_SHA: ${COMMIT_SHA:-unknown}

x-database-connection: &database-connection
  Database__ConnectionString: "Server=db,1433;Database=EcommerceDb;User Id=sa;Password=${DB_SA_PASSWORD:?DB_SA_PASSWORD must be set in .env};TrustServerCertificate=True;MultipleActiveResultSets=true"

x-servicebus-connection: &servicebus-connection
  ServiceBus__ConnectionString: ${SERVICEBUS_CONNECTION_STRING:?SERVICEBUS_CONNECTION_STRING must be set in .env}

# Telemetry goes to the OpenTelemetry Collector. The api and consumer do NOT depend on it
# starting: if it is down they keep working and just drop telemetry.
x-telemetry: &telemetry
  Telemetry__Exporter: Otlp
  Telemetry__OtlpEndpoint: http://otel-collector:4317
  Telemetry__SamplingRatio: ${OTEL_SAMPLING_RATIO:-1.0}

services:
  # One-off job: applies the EF Core migrations, then exits 0. The api and consumer
  # wait for it to finish successfully, so tables exist before anything serves traffic.
  migrator:
    build:
      <<: *app-build
      target: migrator
    image: ecommerce-backend-migrator:local
    entrypoint:
      - sh
      - -c
      - exec ./efbundle --connection "$$Database__ConnectionString"
    environment:
      <<: *database-connection
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  api:
    build: *app-build
    image: ecommerce-backend-api:local
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # Development enables the Admin/User role + default admin seeding and the
      # Scalar docs; this stack depends on the Service Bus emulator, so it is a
      # local-only stack anyway.
      ASPNETCORE_ENVIRONMENT: Development
      # The api only takes requests and publishes orders; the consumer service processes them.
      Consumer__Enabled: "false"
      <<: [*database-connection, *servicebus-connection, *telemetry]
      Jwt__Key: ${JWT_KEY:?JWT_KEY must be set in .env}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL must be set in .env}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set in .env}
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      servicebus-emulator-ready:
        condition: service_completed_successfully
    restart: on-failure:3
    networks:
      - backend

  # Same image as the api, started with the HTTP API switched off: it only reads the
  # order-placed queue and updates orders. It can be stopped and started on its own.
  consumer:
    build: *app-build
    image: ecommerce-backend-api:local
    environment:
      Api__Enabled: "false"
      <<: [*database-connection, *servicebus-connection, *telemetry]
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      servicebus-emulator-ready:
        condition: service_completed_successfully
    restart: on-failure:3
    networks:
      - backend

  # Receives traces, metrics and logs from the api and consumer (OTLP) and forwards them.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - "./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro"
    networks:
      - backend

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?DB_SA_PASSWORD must be set in .env}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      # Healthy only once the engine actually answers a query, not just when the container starts.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  # Backing store required by the Service Bus emulator; separate from the app's database.
  sql-edge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SERVICEBUS_SQL_PASSWORD:?SERVICEBUS_SQL_PASSWORD must be set in .env}
    networks:
      - backend

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    volumes:
      - "./docker/servicebus-emulator/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro"
    ports:
      # Exposed on the host so the integration tests can reach the emulator too.
      - "5672:5672"
      - "5300:5300"
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sql-edge
      MSSQL_SA_PASSWORD: ${SERVICEBUS_SQL_PASSWORD:?SERVICEBUS_SQL_PASSWORD must be set in .env}
    depends_on:
      - sql-edge
    networks:
      - backend

  # The emulator image is distroless (no shell or curl), so it can't run its own
  # healthcheck. This one-shot container polls the emulator's /health endpoint
  # from the network and exits 0 once it answers, which gates the api and consumer.
  servicebus-emulator-ready:
    image: curlimages/curl:8.11.1
    command:
      - --silent
      - --fail
      - --output
      - /dev/null
      - --max-time
      - "5"
      - --retry
      - "60"
      - --retry-delay
      - "2"
      - --retry-all-errors
      - http://servicebus-emulator:5300/health
    depends_on:
      - servicebus-emulator
    networks:
      - backend

volumes:
  db-data:

networks:
  backend:
